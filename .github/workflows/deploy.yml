name: Deploy to GitHub Pages

# Grant workflow permission to write repository contents so Actions can push to gh-pages
permissions:
    contents: write

on:
    push:
        branches: [main]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  # persist the token so subsequent steps can push
                  persist-credentials: true
            - uses: actions/setup-node@v4
              with:
                  node-version: "18"
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build
            - name: Deploy to gh-pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./dist
